<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Economic Abuse Icon - Money symbol -->
  <circle cx="100" cy="100" r="90" fill="#f8f8f8" stroke="#66bb6a" stroke-width="2"/>
  <g fill="#66bb6a">
    <!-- Stylized dollar bill -->
    <rect x="60" y="70" width="80" height="60" rx="5" fill="#66bb6a" opacity="0.8"/>
    <!-- Dollar sign -->
    <path d="M100,65 L100,135" stroke="#f8f8f8" stroke-width="6" stroke-linecap="round"/>
    <path d="M90,75 C90,75 90,85 100,85 C110,85 110,95 100,95 C90,95 90,105 100,105 C110,105 110,115 100,115" stroke="#f8f8f8" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
